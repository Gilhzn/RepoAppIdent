<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#050505" />
<meta name="description" content="General Parts — אולם תצוגה דיגיטלי לחלפי רכב יוקרתיים: מנוע, בלמים, מתלים. הנדסה מדויקת, ביצועים שאין להתפשר עליהם." />
<title>General Parts — אולם תצוגה דיגיטלי</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Heebo:wght@300;400;500;600;700;800;900&family=Assistant:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>

<style>
/* ───────── Reset & tokens ───────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #050505;
  --bg-1: #0a0a0a;
  --ink: #f4f1ea;
  --ink-dim: #c8c5be;
  --ink-mute: #6a665f;
  --rule: rgba(244, 241, 234, 0.08);
  --rule-strong: rgba(244, 241, 234, 0.18);
  --gold: #c8a567;
  --gold-glow: rgba(200, 165, 103, 0.45);

  --font-display: 'Bebas Neue', 'Heebo', 'Assistant', sans-serif;
  --font-sans-ltr: 'Inter', system-ui, sans-serif;
  --font-sans-rtl: 'Heebo', 'Assistant', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-label: 'Inter', system-ui, sans-serif;

  --ease: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}

[dir="rtl"] {
  --font-mono: 'Heebo', 'Assistant', sans-serif;
  --font-label: 'Heebo', 'Assistant', sans-serif;
  --font-display: 'Heebo', 'Assistant', sans-serif;
}

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans-rtl);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html[lang="en"], html[dir="ltr"] { font-family: var(--font-sans-ltr); }
body { overflow-x: clip; }   /* CRITICAL: do NOT use overflow-x: hidden */

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* ───────── Stage layers ───────── */
#scroll-spacer {
  position: relative;
  width: 100%;
  height: 500vh;
  pointer-events: none;
}

#webgl {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}

#root {
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  font-family: inherit;
}

#root > * { pointer-events: auto; }
#root .pass-through, #root .pass-through * { pointer-events: none; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

/* ───────── Preloader ───────── */
.preloader {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 1000;
  display: grid;
  place-items: center;
  transition: opacity 800ms var(--ease), visibility 0s linear 800ms;
}
.preloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
.preloader__inner { text-align: center; padding-inline: 16px; max-width: min(960px, 96vw); width: 100%; }
.preloader__wordmark {
  /* Brand stays in Latin display font regardless of UI language */
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(30px, 6.4vw, 78px);
  letter-spacing: 0.06em;
  line-height: 1.0;
  white-space: nowrap;
  display: inline-block;
  background: linear-gradient(180deg, var(--ink) 0%, var(--ink) 50%, var(--gold) 50%, var(--gold) 100%);
  background-size: 100% 200%;
  background-position: 0% 0%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  transition: background-position 200ms linear;
}
.preloader__bar {
  margin: 28px auto 0;
  width: min(380px, 70vw);
  height: 1px;
  background: var(--rule);
  position: relative;
  overflow: hidden;
}
.preloader__bar::after {
  content: '';
  position: absolute;
  inset-inline-start: 0;
  top: 0;
  height: 100%;
  width: 100%;
  background: var(--gold);
  transform-origin: left center;
  transform: scaleX(var(--p, 0));
  transition: transform 200ms linear;
}
[dir="rtl"] .preloader__bar::after { transform-origin: right center; }
.preloader__caption {
  margin-top: 16px;
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--ink-dim);
  text-transform: uppercase;
  font-weight: 500;
  font-feature-settings: 'tnum';
}
[dir="rtl"] .preloader__caption { letter-spacing: 0.04em; font-size: 13px; }

/* ───────── Top bar ───────── */
.topbar {
  position: fixed;
  top: 0;
  inset-inline: 0;
  height: 64px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding-inline: clamp(16px, 4vw, 48px);
  z-index: 30;
  background: linear-gradient(180deg, rgba(5,5,5,0.8) 0%, rgba(5,5,5,0) 100%);
}
.topbar__brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  /* Brand stays in Latin display font regardless of UI language */
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.20em;
  white-space: nowrap;
  color: var(--ink);
}
.topbar__brand .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px 2px var(--gold-glow);
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.1); }
}
.topbar__nav {
  display: flex;
  gap: clamp(12px, 2.4vw, 28px);
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  font-weight: 500;
}
[dir="rtl"] .topbar__nav { font-size: 14px; letter-spacing: 0.04em; font-weight: 600; }
.topbar__nav button {
  position: relative;
  padding-block: 6px;
  color: inherit;
  transition: color 240ms var(--ease);
}
.topbar__nav button.active,
.topbar__nav button:hover { color: var(--ink); }
.topbar__nav button.active::after {
  content: '';
  position: absolute;
  inset-inline: 0;
  bottom: -2px;
  height: 2px;
  background: var(--gold);
}
.topbar__tools {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  justify-content: flex-end;
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 500;
}
.topbar__tools .lang-toggle {
  border: 1px solid var(--rule-strong);
  padding: 7px 14px;
  color: var(--ink);
  font-family: var(--font-label);
  font-weight: 600;
  transition: border-color 240ms var(--ease), color 240ms var(--ease), background 240ms var(--ease);
}
.topbar__tools .lang-toggle:hover { border-color: var(--gold); color: var(--gold); }
.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  color: var(--ink-dim);
  transition: color 240ms var(--ease);
}
.icon-btn:hover { color: var(--ink); }

/* ───────── Side rail ───────── */
.siderail {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  inset-inline-end: clamp(14px, 2.4vw, 28px);
  z-index: 25;
  display: flex;
  flex-direction: column;
  gap: 22px;
  transition: opacity 400ms var(--ease);
}
.siderail__item {
  /* row-reverse works in both LTR and RTL — places label inward, bar at viewport edge */
  display: flex;
  flex-direction: row-reverse;
  align-items: center;
  gap: 12px;
  color: var(--ink-dim);
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  transition: color 320ms var(--ease);
  background: none;
  border: none;
  cursor: pointer;
  text-align: end;
  font-weight: 600;
}
[dir="rtl"] .siderail__item { font-size: 13px; letter-spacing: 0.02em; font-weight: 600; }
.siderail__item .bar {
  width: 24px;
  height: 1px;
  background: var(--rule-strong);
  transition: width 320ms var(--ease), background 320ms var(--ease);
  flex-shrink: 0;
}
.siderail__item.active { color: var(--ink); }
.siderail__item.active .bar { width: 44px; background: var(--gold); }
.siderail__item:hover { color: var(--ink); }
.siderail__item:hover .bar { background: var(--gold); }
.siderail__item .label {
  white-space: nowrap;
  opacity: 0;
  transition: opacity 280ms var(--ease);
}
.siderail__item.active .label,
.siderail__item:hover .label { opacity: 1; }

/* ───────── Info card ───────── */
.infocard {
  position: fixed;
  bottom: 110px;
  inset-inline-start: clamp(16px, 4vw, 48px);
  z-index: 25;
  max-width: min(440px, 80vw);
  background: transparent;
  border: none;
  border-inline-start: 2px solid var(--gold);
  padding: clamp(18px, 2vw, 26px) clamp(20px, 2.2vw, 28px);
  opacity: 0;
  transform: translateY(20px);
  color: #ffffff;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85), 0 2px 14px rgba(0, 0, 0, 0.6);
}
.infocard.visible { animation: infocard-in 520ms var(--ease) forwards; }
@keyframes infocard-in {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
.infocard__index {
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
  font-weight: 600;
}
[dir="rtl"] .infocard__index { letter-spacing: 0.10em; }
.infocard__title {
  font-family: var(--font-display);
  font-size: clamp(30px, 3.4vw, 46px);
  letter-spacing: 0.02em;
  line-height: 1.0;
  margin-bottom: 14px;
  text-wrap: balance;
  color: #ffffff;
  font-weight: 700;
}
[dir="rtl"] .infocard__title {
  font-weight: 800;
  letter-spacing: -0.005em;
  line-height: 1.1;
}
.infocard__body {
  font-size: 15px;
  line-height: 1.7;
  color: #ffffff;
  opacity: 0.92;
  margin-bottom: 20px;
}
[dir="rtl"] .infocard__body {
  font-size: 15px;
  line-height: 1.75;
}
.infocard__specs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  padding-block-start: 16px;
  border-block-start: 1px solid rgba(255, 255, 255, 0.20);
}
.infocard__spec-label {
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: #ffffff;
  opacity: 0.55;
  margin-bottom: 4px;
  font-weight: 600;
}
[dir="rtl"] .infocard__spec-label { letter-spacing: 0.04em; }
.infocard__spec-value {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 0.04em;
  color: #ffffff;
  font-weight: 700;
}
[dir="rtl"] .infocard__spec-value { font-weight: 700; letter-spacing: 0; }
.infocard__cta {
  margin-top: 22px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 22px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #ffffff;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.02);
  transition: border-color 240ms var(--ease), color 240ms var(--ease), background 240ms var(--ease);
}
[dir="rtl"] .infocard__cta { letter-spacing: 0.06em; font-size: 13px; }
.infocard__cta::after { content: ' →'; }
[dir="rtl"] .infocard__cta::after { content: ' ←'; }
.infocard__cta:hover {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(200, 165, 103, 0.06);
}

/* ───────── Bottom dock ───────── */
.dock {
  position: fixed;
  inset-inline: 0;
  bottom: 0;
  z-index: 25;
  padding: 16px clamp(16px, 4vw, 48px) 20px;
  background: linear-gradient(0deg, rgba(5,5,5,0.85) 0%, rgba(5,5,5,0) 100%);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end;
  gap: clamp(16px, 3vw, 36px);
}
.dock__progress {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  font-weight: 600;
}
[dir="rtl"] .dock__progress { font-size: 12px; letter-spacing: 0.04em; }
.dock__progress .label-top { color: var(--ink-dim); }
.dock__progress .number {
  font-family: var(--font-display);
  font-size: clamp(36px, 4vw, 52px);
  font-feature-settings: 'tnum';
  letter-spacing: 0.04em;
  color: var(--ink);
  line-height: 0.95;
  font-weight: 700;
}
.dock__timeline {
  height: 28px;
  position: relative;
  display: flex;
  align-items: center;
}
.dock__timeline-track {
  position: relative;
  width: 100%;
  height: 1px;
  background: var(--rule);
}
.dock__timeline-fill {
  position: absolute;
  inset-inline-start: 0;
  top: 0;
  height: 100%;
  width: 100%;
  background: var(--gold);
  transform-origin: left center;
  transform: scaleX(var(--p, 0));
}
[dir="rtl"] .dock__timeline-fill { transform-origin: right center; }
.dock__timeline-dots {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
}
.dock__timeline-dot {
  position: absolute;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--rule-strong);
  transform: translate(-50%, 0);
  cursor: pointer;
  transition: border-color 200ms var(--ease), background 200ms var(--ease);
}
[dir="rtl"] .dock__timeline-dot { transform: translate(50%, 0); }
.dock__timeline-dot.active {
  background: var(--gold);
  border-color: var(--gold);
}
.dock__timeline-dot:hover { border-color: var(--gold); }
.dock__timeline-labels {
  position: absolute;
  inset-inline: 0;
  top: -20px;
  display: flex;
  font-family: var(--font-label);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-dim);
  pointer-events: none;
  font-weight: 600;
}
[dir="rtl"] .dock__timeline-labels { letter-spacing: 0.02em; font-size: 11px; }
.dock__timeline-label {
  position: absolute;
  transform: translateX(-50%);
}
[dir="rtl"] .dock__timeline-label { transform: translateX(50%); }
.dock__scroll {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  font-weight: 600;
}
[dir="rtl"] .dock__scroll { font-size: 12px; letter-spacing: 0.04em; }
.dock__scroll .line {
  width: 1px;
  height: 32px;
  background: linear-gradient(180deg, transparent 0%, var(--gold) 30%, var(--gold) 70%, transparent 100%);
  animation: scroll-line 2s ease-in-out infinite;
}
@keyframes scroll-line {
  0%, 100% { transform: scaleY(0.4); opacity: 0.4; }
  50% { transform: scaleY(1); opacity: 1; }
}

/* ───────── Hotspots ───────── */
.hotspot {
  position: fixed;
  top: 0;
  left: 0;  /* JS-positioned via translate3d — always from viewport left */
  width: 44px;
  height: 44px;
  z-index: 20;
  pointer-events: auto;
  transition: opacity 320ms var(--ease);
}
.hotspot__dot {
  position: relative;
  width: 100%;
  height: 100%;
  border: 1px solid var(--gold);
  background: rgba(200, 165, 103, 0.08);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border-radius: 50%;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.hotspot__dot::before,
.hotspot__dot::after {
  content: '';
  position: absolute;
  inset: 0;
  border: 1px solid var(--gold);
  border-radius: 50%;
  animation: ripple 2.4s ease-out infinite;
}
.hotspot__dot::after { animation-delay: 1.2s; }
@keyframes ripple {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2.4); opacity: 0; }
}
.hotspot__dot-inner {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px 2px var(--gold-glow);
}
.hotspot__label {
  position: absolute;
  top: 50%;
  inset-inline-start: 56px;
  transform: translateY(-50%);
  white-space: nowrap;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #ffffff;
  background: rgba(8, 8, 10, 0.85);
  border: 1px solid rgba(200, 165, 103, 0.35);
  padding: 7px 11px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  opacity: 0;
  transition: opacity 320ms var(--ease);
  font-weight: 600;
}
[dir="rtl"] .hotspot__label { letter-spacing: 0; font-size: 12px; }
.hotspot:hover .hotspot__label,
.hotspot.active .hotspot__label { opacity: 1; }

/* ───────── Outro ───────── */
.outro {
  position: fixed;
  inset: 0;
  z-index: 28;
  display: grid;
  place-items: center;
  background: radial-gradient(ellipse at center, rgba(5,5,5,0) 30%, rgba(0,0,0,0.85) 100%);
  opacity: 0;
  transition: opacity 600ms var(--ease);
  pointer-events: none;
}
.outro.visible { opacity: 1; pointer-events: auto; }
.outro__inner {
  text-align: center;
  padding-inline: 24px;
  max-width: 900px;
}
.outro__title {
  font-family: var(--font-display);
  font-size: clamp(48px, 10vw, 160px);
  letter-spacing: 0.04em;
  line-height: 0.92;
  text-wrap: balance;
  margin-bottom: 28px;
}
[dir="rtl"] .outro__title {
  font-family: 'Heebo', 'Assistant', sans-serif;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.0;
}
.outro__title .gold-italic {
  color: var(--gold);
  font-style: italic;
}
[dir="rtl"] .outro__title .gold-italic {
  font-style: normal;
  font-weight: 700;
}
.outro__body {
  font-size: clamp(15px, 1.4vw, 18px);
  color: var(--ink-dim);
  line-height: 1.6;
  max-width: 560px;
  margin: 0 auto 36px;
}
.outro__ctas {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 16px;
  justify-content: center;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 28px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  font-family: var(--font-label);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #ffffff;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.02);
  transition: border-color 240ms var(--ease), color 240ms var(--ease), background 240ms var(--ease);
}
[dir="rtl"] .btn { letter-spacing: 0.04em; font-size: 13px; }
.btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(200,165,103,0.04); }
.btn--primary { background: var(--gold); border-color: var(--gold); color: #0a0a0a; }
.btn--primary:hover { background: #d9b97f; border-color: #d9b97f; color: #0a0a0a; }
.outro__return {
  display: block;
  margin-top: 30px;
  font-family: var(--font-label);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #ffffff;
  opacity: 0.6;
  text-decoration: underline;
  text-underline-offset: 4px;
  font-weight: 500;
  transition: color 240ms var(--ease), opacity 240ms var(--ease);
  background: none;
  border: none;
  cursor: pointer;
}
[dir="rtl"] .outro__return { letter-spacing: 0; font-size: 13px; }
.outro__return:hover { color: var(--gold); opacity: 1; }

/* ───────── Decorative ───────── */
.decorative {
  position: fixed;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  overflow: hidden;
}
.decorative__bg-number {
  position: absolute;
  bottom: -3vw;
  inset-inline-end: -2vw;
  font-family: var(--font-display);
  font-size: clamp(280px, 38vw, 580px);

/* ───────── Utilities ───────── */
const easeInOut = (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const smoothstep = (a, b, x) => {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
const partOpacityFor = (p, [a, b, c, d]) =>
  Math.min(smoothstep(a, b, p), 1 - smoothstep(c, d, p));

const lerp = (a, b, t) => a + (b - a) * t;

  out.x = lerp(a[0], b[0], t);
  out.y = lerp(a[1], b[1], t);

/* ───────── Scene ───────── */
const canvas = document.getElementById('webgl');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040404);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 200);

  const tankFluid = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.038, 0.040, 20), matOrangeFluid);
  tankFluid.position.set(0.22, 0.05, -0.21);
  g.add(tankFluid);
  const tankCap = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.030, 0.018, 16), matAccent);
  tankCap.position.set(0.22, 0.125, -0.21);
  g.add(tankCap);

  // Engine mounts (2 — brackets w/ rubber bushings)
  for (let s = -1; s <= 1; s += 2) {
    const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.050, 0.060), matAluRough);
    bracket.position.set(s * 0.25, -0.040, -0.18);
    g.add(bracket);
    const cushion = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.028, 16), matRubberBlack);
    cushion.position.set(s * 0.25, -0.085, -0.18);
    g.add(cushion);
    const mountBolt = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.080, 6), matBoltSteel);
    mountBolt.position.set(s * 0.25, -0.085, -0.18);
    g.add(mountBolt);
  }

  // GENERAL PARTS billet plate (top of plenum)
  const billetPlate = new THREE.Mesh(
    new THREE.BoxGeometry(0.30, 0.014, 0.060),
    matBilletAccent
  );
  billetPlate.position.set(0, 0.395, -0.05);
  g.add(billetPlate);
  const billetEngrave = new THREE.Mesh(
    new THREE.BoxGeometry(0.26, 0.003, 0.022),
    matEngraveDark
  );
  billetEngrave.position.set(0, 0.404, -0.05);
  g.add(billetEngrave);
  hexBolt(g, -0.13, 0.398, -0.072, 0.005, 0.008);
  hexBolt(g, 0.13, 0.398, -0.072, 0.005, 0.008);
  hexBolt(g, -0.13, 0.398, -0.028, 0.005, 0.008);
  hexBolt(g, 0.13, 0.398, -0.028, 0.005, 0.008);

  return { group: g, materials: M };
}

/* PROCEDURAL: Brakes (Ø410 carbon-ceramic)                          */
/* ═════════════════════════════════════════════════════════════════ */
function buildBrakes() {
  const g = new THREE.Group();
  const localMaterials = [];

  const DISC_R = 0.205;
  const DISC_INNER = 0.105;
  const FACE_THICK = 0.012;
  const VENT_GAP = 0.022;
  const CAL_R = 0.217;
  const CAL_THICK = 0.034;

  const carbonMat = makeMatte(0x141416, { metalness: 0.1, roughness: 0.7 });
  const polishedMat = makeMetal(0xc0c0c4, { roughness: 0.15 });
  const calMat = makeAccent({ roughness: 0.20 });
  const lugMat = makeMetal(0xa8a8ac);
  const padMat = makeMatte(0x322820);
  const pistonMat = makeMetal(0xe0e0e4, { roughness: 0.08 });
  const hubMat = makeMetal(0x141416);
  const hoseMat = makeMatte(0x282830, { metalness: 0.8, roughness: 0.4 });
  const wireMat = makeMatte(0x383838);
  localMaterials.push(carbonMat, polishedMat, calMat, lugMat, padMat, pistonMat, hubMat, hoseMat, wireMat);

  // Disc faces (2x with drilled holes via THREE.Shape + ExtrudeGeometry)
  function makeDiscFace() {
    const shape = new THREE.Shape();
    shape.absarc(0, 0, DISC_R, 0, Math.PI * 2, false);

    // Inner hub bore
    const inner = new THREE.Path();
    inner.absarc(0, 0, DISC_INNER, 0, Math.PI * 2, true);
    shape.holes.push(inner);

    // 24 holes on ring r=0.146
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      const path = new THREE.Path();
      path.absarc(Math.cos(a) * 0.146, Math.sin(a) * 0.146, 0.012, 0, Math.PI * 2, true);
      shape.holes.push(path);
    }
    // 28 holes on ring r=0.174
    for (let i = 0; i < 28; i++) {
      const a = (i / 28) * Math.PI * 2 + Math.PI / 28;
      const path = new THREE.Path();
      path.absarc(Math.cos(a) * 0.174, Math.sin(a) * 0.174, 0.0085, 0, Math.PI * 2, true);
      shape.holes.push(path);
    }

    return new THREE.ExtrudeGeometry(shape, {
      depth: FACE_THICK,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.002,
      bevelThickness: 0.002,
      curveSegments: 48,
    });
  }

  const faceGeo = makeDiscFace();
  const face1 = new THREE.Mesh(faceGeo, carbonMat);
  face1.rotation.x = Math.PI / 2;
  face1.position.z = -VENT_GAP / 2;
  face1.castShadow = true;
  g.add(face1);
  const face2 = new THREE.Mesh(faceGeo, carbonMat);
  face2.rotation.x = Math.PI / 2;
  face2.position.z = VENT_GAP / 2 + FACE_THICK;
  face2.castShadow = true;
  g.add(face2);

  // Polished contact-patch rings (where pads bite)
  for (let s = 0; s < 2; s++) {
    const z = s === 0 ? -VENT_GAP / 2 - 0.001 : VENT_GAP / 2 + FACE_THICK + 0.001;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.140, 0.198, 64),
      polishedMat
    );
    ring.position.z = z;
    g.add(ring);
  }

  // 36 radial cooling fins between faces
  for (let i = 0; i < 36; i++) {
    const a = (i / 36) * Math.PI * 2;
    const fin = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.012, VENT_GAP - 0.002),
      hubMat
    );
    fin.position.set(Math.cos(a) * 0.155, Math.sin(a) * 0.155, FACE_THICK / 2);
    fin.rotation.z = a;
    g.add(fin);
  }

  // Hat (cone connecting disc to hub)
  const hatGeo = new THREE.CylinderGeometry(DISC_INNER, 0.080, 0.04, 32);
  const hat = new THREE.Mesh(hatGeo, hubMat);
  hat.rotation.x = Math.PI / 2;
  hat.position.z = FACE_THICK + 0.020;
  g.add(hat);

  // Hub + 5 lug nuts
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.060, 0.060, 0.03, 24), hubMat);
  hub.rotation.x = Math.PI / 2;
  hub.position.z = FACE_THICK + 0.046;
  g.add(hub);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.020, 6), lugMat);
    lug.rotation.x = Math.PI / 2;
    lug.position.set(Math.cos(a) * 0.038, Math.sin(a) * 0.038, FACE_THICK + 0.055);
    g.add(lug);
  }
  // Center hub cap (gold accent)
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.020, 0.020, 0.014, 24), calMat);
  cap.rotation.x = Math.PI / 2;
  cap.position.z = FACE_THICK + 0.062;
  g.add(cap);

  // Caliper: 0.42π torus arc (around top of disc)
  const arc = 0.42 * Math.PI;
  const calStart = Math.PI / 2 - arc / 2;
  const torusBody = new THREE.Mesh(
    new THREE.TorusGeometry(CAL_R, CAL_THICK / 2, 16, 48, arc),
    calMat
  );
  torusBody.rotation.z = calStart;
  // Replicate for both sides of disc
  const cal1 = torusBody.clone();
  cal1.position.z = -VENT_GAP / 2 + FACE_THICK / 2;
  g.add(cal1);
  const cal2 = torusBody.clone();
  cal2.position.z = VENT_GAP / 2 + FACE_THICK / 2;
  g.add(cal2);

  // 3 ribs along outer surface (each side)
  for (let s = 0; s < 2; s++) {
    const z = s === 0 ? -VENT_GAP / 2 + FACE_THICK / 2 : VENT_GAP / 2 + FACE_THICK / 2;
    for (let i = 0; i < 3; i++) {
      const a = calStart + arc * (0.25 + i * 0.25);
      const rib = new THREE.Mesh(
        new THREE.BoxGeometry(0.006, 0.040, CAL_THICK + 0.004),
        calMat
      );
      rib.position.set(Math.cos(a) * (CAL_R + CAL_THICK / 2 + 0.002), Math.sin(a) * (CAL_R + CAL_THICK / 2 + 0.002), z);
      rib.rotation.z = a;
      g.add(rib);
    }
  }

  // 3 pistons per side
  for (let s = 0; s < 2; s++) {
    const z = s === 0 ? -VENT_GAP / 2 - 0.010 : VENT_GAP / 2 + FACE_THICK + 0.010;
    const dir = s === 0 ? 1 : -1;
    for (let i = 0; i < 3; i++) {
      const a = calStart + arc * (0.2 + i * 0.3);
      const piston = new THREE.Mesh(
        new THREE.CylinderGeometry(0.020, 0.020, 0.022, 16),
        pistonMat
      );
      piston.position.set(Math.cos(a) * (CAL_R - 0.010), Math.sin(a) * (CAL_R - 0.010), z);
      piston.rotation.x = Math.PI / 2;
      g.add(piston);
    }
  }

  // 4 bridges over top
  for (let i = 0; i < 4; i++) {
    const a = calStart + arc * (0.15 + i * 0.23);
    const bridge = new THREE.Mesh(
      new THREE.BoxGeometry(0.014, 0.012, VENT_GAP + FACE_THICK * 2 + 0.006),
      calMat
    );
    bridge.position.set(Math.cos(a) * (CAL_R + CAL_THICK / 2), Math.sin(a) * (CAL_R + CAL_THICK / 2), FACE_THICK / 2);
    bridge.rotation.z = a;
    g.add(bridge);
  }

  // 6 brake pads (3 per side)
  for (let s = 0; s < 2; s++) {
    const z = s === 0 ? -VENT_GAP / 2 - 0.006 : VENT_GAP / 2 + FACE_THICK + 0.006;
    for (let i = 0; i < 3; i++) {
      const a = calStart + arc * (0.2 + i * 0.3);
      const pad = new THREE.Mesh(
        new THREE.BoxGeometry(0.026, 0.055, 0.006),
        padMat
      );
      pad.position.set(Math.cos(a) * (CAL_R - 0.030), Math.sin(a) * (CAL_R - 0.030), z);
      pad.rotation.z = a + Math.PI / 2;
      g.add(pad);
    }
  }

  // Etched plate (engraved)
  for (let s = 0; s < 2; s++) {
    const z = s === 0 ? -VENT_GAP / 2 - 0.012 : VENT_GAP / 2 + FACE_THICK + 0.012;
    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(0.10, 0.020, 0.004),
      makeMetal(0x7a5a20, { roughness: 0.5 })
    );
    plate.position.set(0, CAL_R, z);
    g.add(plate);
  }

  // Braided brake hose + 12 stainless rings
  const hoseCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.04, CAL_R + 0.04, FACE_THICK / 2),
    new THREE.Vector3(-0.10, CAL_R + 0.10, FACE_THICK / 2),
    new THREE.Vector3(-0.18, CAL_R + 0.08, FACE_THICK / 2),
    new THREE.Vector3(-0.24, CAL_R - 0.02, FACE_THICK / 2),
  ]);
  const hose = new THREE.Mesh(
    new THREE.TubeGeometry(hoseCurve, 30, 0.008, 8, false),
    hoseMat
  );
  g.add(hose);
  for (let i = 0; i < 12; i++) {
    const t = (i + 0.5) / 12;
    const pos = hoseCurve.getPointAt(t);
    const tan = hoseCurve.getTangentAt(t);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.0095, 0.001, 6, 16),
      polishedMat
    );
    ring.position.copy(pos);
    const matrix = new THREE.Matrix4().lookAt(new THREE.Vector3(0,0,0), tan, new THREE.Vector3(0,1,0));
    ring.quaternion.setFromRotationMatrix(matrix);
    g.add(ring);
  }
  // Banjo fitting at hose entry
  const banjo = new THREE.Mesh(new THREE.BoxGeometry(0.020, 0.020, 0.022), polishedMat);
  banjo.position.set(-0.04, CAL_R + 0.04, FACE_THICK / 2);
  g.add(banjo);

  // ABS sensor wire
  const absCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.05, 0.04, FACE_THICK + 0.06),
    new THREE.Vector3(0.10, 0.02, FACE_THICK + 0.10),
    new THREE.Vector3(0.16, -0.04, FACE_THICK + 0.12),
  ]);
  const absWire = new THREE.Mesh(
    new THREE.TubeGeometry(absCurve, 16, 0.003, 6, false),
    wireMat
  );
  g.add(absWire);

  return { group: g, materials: localMaterials };
}

/* PROCEDURAL: Coil-over suspension                                  */
/* ═════════════════════════════════════════════════════════════════ */
function buildSuspension() {
  const g = new THREE.Group();
  const localMaterials = [];

  const anodised = makeMetal(0x14181c, { roughness: 0.35 });
  const chromeMat = makeChrome();
  const accentMat = makeAccent({ roughness: 0.18 });
  const yellowMat = makeMatte(0xd9b540, { metalness: 0.3, roughness: 0.5 });
  const springMat = makeAccent({ roughness: 0.22 });
  const bushMat = makeMatte(0x14141a, { roughness: 0.9 });
  const reservoirMat = makeMetal(0x282830, { roughness: 0.4 });
  localMaterials.push(anodised, chromeMat, accentMat, yellowMat, springMat, bushMat, reservoirMat);

  // Shock body (lower)
  const bodyLow = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.22, 28), anodised);
  bodyLow.position.y = -0.16;
  g.add(bodyLow);
  // 18 thin rings (visual threading)
  for (let i = 0; i < 18; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.046, 0.0015, 6, 28),
      anodised
    );
    ring.position.y = -0.27 + i * 0.012;
    ring.rotation.x = Math.PI / 2;
    g.add(ring);
  }

  // Spring perch collar (knurled)
  const perchLow = new THREE.Mesh(new THREE.CylinderGeometry(0.054, 0.054, 0.026, 32), accentMat);
  perchLow.position.y = -0.04;
  g.add(perchLow);
  // Knurl rings on perch
  for (let i = 0; i < 3; i++) {
    const k = new THREE.Mesh(
      new THREE.TorusGeometry(0.055, 0.0012, 6, 32),
      accentMat
    );
    k.position.y = -0.052 + i * 0.012;
    k.rotation.x = Math.PI / 2;
    g.add(k);
  }

  // Chrome shaft
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.20, 20), chromeMat);
  shaft.position.y = 0.10;
  g.add(shaft);

  // Yellow bump-stop
  const bump = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.040, 20), yellowMat);
  bump.position.y = 0.04;
  g.add(bump);

  // Upper spring perch
  const perchUp = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.020, 32), accentMat);
  perchUp.position.y = 0.165;
  g.add(perchUp);

  // Helical spring (TubeGeometry along 3D helix curve)
  const springPoints = [];
  const coils = 8;
  const segPerCoil = 28;
  for (let i = 0; i <= coils * segPerCoil; i++) {
    const t = i / (coils * segPerCoil);
    const a = t * Math.PI * 2 * coils;
    const y = -0.025 + t * 0.18;
    springPoints.push(new THREE.Vector3(Math.cos(a) * 0.048, y, Math.sin(a) * 0.048));
  }
  const springCurve = new THREE.CatmullRomCurve3(springPoints);
  const spring = new THREE.Mesh(
    new THREE.TubeGeometry(springCurve, coils * segPerCoil, 0.0070, 10, false),
    springMat
  );
  g.add(spring);

  // Top mount
  const topMount = new THREE.Mesh(new THREE.CylinderGeometry(0.060, 0.054, 0.030, 24), anodised);
  topMount.position.y = 0.215;
  g.add(topMount);
  // Center stud
  const stud = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.020, 16), chromeMat);
  stud.position.y = 0.240;
  g.add(stud);
  // 3 hex bolts
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2;
    const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.018, 6), chromeMat);
    bolt.position.set(Math.cos(a) * 0.040, 0.230, Math.sin(a) * 0.040);
    g.add(bolt);
  }

  // Damping adjuster knob (gold)
  const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.020, 24), accentMat);
  knob.position.set(0, -0.27, 0.06);
  knob.rotation.x = Math.PI / 2;
  g.add(knob);
  // Knurl on knob
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    const nub = new THREE.Mesh(
      new THREE.BoxGeometry(0.003, 0.020, 0.003),
      accentMat
    );
    nub.position.set(Math.cos(a) * 0.0225, -0.27, 0.06 + Math.sin(a) * 0.0225);
    g.add(nub);
  }
  const knobRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.024, 0.0015, 6, 24),
    accentMat
  );
  knobRing.position.set(0, -0.27, 0.072);
  g.add(knobRing);

  // Bottom eyelet with bushing
  const eyelet = new THREE.Mesh(new THREE.TorusGeometry(0.030, 0.012, 12, 24), anodised);
  eyelet.position.y = -0.295;
  eyelet.rotation.x = Math.PI / 2;
  g.add(eyelet);
  const bushing = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.030, 20), bushMat);
  bushing.position.y = -0.295;
  bushing.rotation.x = Math.PI / 2;
  g.add(bushing);

  // Control-arm stub
  const armStub = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.020, 0.030), makeMetal(0x383840));
  armStub.position.set(-0.10, -0.295, 0);
  g.add(armStub);
  // Spherical ball joint
  const ballJoint = new THREE.Mesh(new THREE.SphereGeometry(0.024, 16, 16), chromeMat);
  ballJoint.position.set(-0.20, -0.295, 0);
  g.add(ballJoint);

  // Piggyback reservoir (angled cylinder)
  const reservoir = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.10, 20), reservoirMat);
  reservoir.position.set(0.07, -0.18, 0);
  reservoir.rotation.z = 0.4;
  g.add(reservoir);
  const resRing = new THREE.Mesh(new THREE.TorusGeometry(0.027, 0.002, 8, 24), accentMat);
  resRing.position.set(0.07, -0.13, 0);
  resRing.rotation.z = 0.4;
  resRing.rotation.x = Math.PI / 2;
  g.add(resRing);
  const resCap = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.026, 0.014, 20), accentMat);
  resCap.position.set(0.085, -0.13, 0);
  resCap.rotation.z = 0.4;
  g.add(resCap);
  // Hose to lower body
  const resHoseCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.055, -0.23, 0),
    new THREE.Vector3(0.080, -0.25, 0),
    new THREE.Vector3(0.060, -0.27, 0),
    new THREE.Vector3(0.030, -0.265, 0),
  ]);
  const resHose = new THREE.Mesh(
    new THREE.TubeGeometry(resHoseCurve, 20, 0.008, 8, false),
    makeMetal(0x202024, { roughness: 0.5 })
  );
  g.add(resHose);

  return { group: g, materials: localMaterials };
}

/* ───────── Build & position parts ───────── */
const engineKit = buildEngine();
const brakesKit = buildBrakes();
const suspKit = buildSuspension();

engineKit.group.position.set(0, 1.05, -1.55);
scene.add(engineKit.group);

brakesKit.group.position.set(0.83, 0.36, -1.155);
brakesKit.group.rotation.y = -Math.PI / 2; // disc faces side
scene.add(brakesKit.group);

suspKit.group.position.set(0.83, 0.60, -1.155);
scene.add(suspKit.group);

const allPartMaterials = [
  ...engineKit.materials,
  ...brakesKit.materials,
  ...suspKit.materials,
];
allPartMaterials.forEach(m => { m.opacity = 0; });

/* ───────── Ferrari GLB ───────── */
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
dracoLoader.setDecoderConfig({ type: 'js' });

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);

const carBodyMat = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(window.appState.body),
  metalness: 1.0,
  roughness: 0.35,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  envMapIntensity: 1.05,
});
bodyMaterials.push(carBodyMat);

const carGlassMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0e16,
  metalness: 0,
  roughness: 0.04,
  transmission: 0.18,
  ior: 1.5,
  transparent: true,
  opacity: 0.58,
});

const carDetailMat = new THREE.MeshPhysicalMaterial({
  color: 0x141414,
  metalness: 1.0,
  roughness: 0.5,
});

let carGroup = null;

gltfLoader.load(
  'https://threejs.org/examples/models/gltf/ferrari.glb',
  (gltf) => {
    carGroup = gltf.scene;
    carGroup.traverse((child) => {
      if (!child.isMesh) return;
      const name = (child.name || '').toLowerCase();
      const matName = (child.material?.name || '').toLowerCase();
      // Strip branding
      if (/logo|emblem|badge|decal|cavallino|ferrari/i.test(name) ||
          /logo|emblem|badge|decal|cavallino|ferrari/i.test(matName)) {
        child.visible = false;
        return;
      }
      // Body parts
      if (/body|chassis|paint|shell/i.test(name) || /body|paint/i.test(matName)) {
        child.material = carBodyMat;
      } else if (/glass|window|windscreen|windshield/i.test(name) || /glass/i.test(matName)) {
        child.material = carGlassMat;
      } else {
        child.material = carDetailMat;
      }
      child.castShadow = true;
      child.receiveShadow = true;
    });
    scene.add(carGroup);
    window.appState.ready = true;
    window.appState.loaded = 100;
    window.dispatchEvent(new CustomEvent('app:loaded'));
  },
  (xhr) => {
    if (xhr.lengthComputable && xhr.total > 0) {
      window.appState.loaded = Math.min(99, Math.round((xhr.loaded / xhr.total) * 100));
    } else {
      window.appState.loaded = Math.min(80, window.appState.loaded + 2);
    }
    window.dispatchEvent(new CustomEvent('app:progress'));
  },
  (err) => {
    console.warn('GLB load failed, continuing without car:', err);
    window.appState.ready = true;
    window.appState.loaded = 100;
    window.dispatchEvent(new CustomEvent('app:loaded'));
  }
);

/* ───────── HDRI environment (reflections only — not background) ───────── */
const rgbeLoader = new RGBELoader();
rgbeLoader.load(
  'https://threejs.org/examples/textures/equirectangular/venice_sunset_1k.hdr',
  (texture) => {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = texture;
    scene.environmentIntensity = 1.10;
  },
  undefined,
  (err) => console.warn('HDRI load failed:', err)
);

/* ───────── AO contact shadow plane ───────── */
const aoLoader = new THREE.TextureLoader();
aoLoader.load(
  'https://threejs.org/examples/models/gltf/ferrari_ao.png',
  (aoTex) => {
    const shadowMat = new THREE.MeshBasicMaterial({
      map: aoTex,
      transparent: true,
      depthWrite: false,
      opacity: 0.7,
    });
    const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(0.655 * 4, 1.3 * 4), shadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.005;
    scene.add(shadowPlane);
  }
);

/* Floor (subtle reflective) */
const floorMat = new THREE.MeshPhysicalMaterial({
  color: 0x040404,
  metalness: 0.4,
  roughness: 0.55,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ───────── Post-processing ───────── */
const composer = new EffectComposer(renderer);
composer.setSize(window.innerWidth, window.innerHeight);
composer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.42 * window.appState.bloomTweak * 0.55,
  0.85,
  0.86
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ───────── Scroll engine ───────── */
let targetProgress = 0;
let currentProgress = 0;

function onScroll() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  targetProgress = max > 0 ? window.scrollY / max : 0;
}
window.addEventListener('scroll', onScroll, { passive: true });
onScroll();

function getCamAtProgress(p) {
  for (let i = 0; i < CAM.length - 1; i++) {
    const a = CAM[i];
    const b = CAM[i + 1];
    if (p >= a.p && p <= b.p) {
      const span = b.p - a.p || 1;
      const t = easeInOut((p - a.p) / span);
      return {
        pos: [lerp(a.pos[0], b.pos[0], t), lerp(a.pos[1], b.pos[1], t), lerp(a.pos[2], b.pos[2], t)],
        tgt: [lerp(a.tgt[0], b.tgt[0], t), lerp(a.tgt[1], b.tgt[1], t), lerp(a.tgt[2], b.tgt[2], t)],
        fov: lerp(a.fov, b.fov, t),
      };
    }
  }
  const last = CAM[CAM.length - 1];
  return { pos: last.pos, tgt: last.tgt, fov: last.fov };
}

/* ───────── Mutators ───────── */
window.appState.setAccent = (hex) => {
  window.appState.accent = hex;
  const c = new THREE.Color(hex);
  accentMaterials.forEach(m => m.color.copy(c));
  rimLight.color.copy(c);
  document.documentElement.style.setProperty('--gold', hex);
  // Derive a 0.45-alpha glow color for box-shadows
  const r = parseInt(hex.slice(1, 3), 16);
  const gr = parseInt(hex.slice(3, 5), 16);
  const bl = parseInt(hex.slice(5, 7), 16);
  document.documentElement.style.setProperty('--gold-glow', `rgba(${r},${gr},${bl},0.45)`);
};
window.appState.setBody = (hex) => {
  window.appState.body = hex;
  const c = new THREE.Color(hex);
  carBodyMat.color.copy(c);
};
window.appState.setBloom = (v) => {
  window.appState.bloomTweak = v;
  bloom.strength = 0.42 * v * 0.55;
};
window.appState.setLerp = (v) => { window.appState.lerpStrength = v; };
window.appState.setScrollLength = (v) => {
  window.appState.scrollLength = v;
  document.getElementById('scroll-spacer').style.height = (500 * v) + 'vh';
  onScroll();
};
window.appState.jumpTo = (p) => {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  window.scrollTo({ top: max * p, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
};

/* ───────── Resize ───────── */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
}
window.addEventListener('resize', onResize, { passive: true });

/* ───────── Animation loop ───────── */
const tmpV = new THREE.Vector3();
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function animate(now) {
  requestAnimationFrame(animate);

  if (prefersReducedMotion) {
    // Snap to target (no inertia)
    currentProgress = targetProgress;
  } else {
    currentProgress += (targetProgress - currentProgress) * window.appState.lerpStrength;
  }
  window.appState.progress = currentProgress;

  const cam = getCamAtProgress(currentProgress);
  camera.position.set(cam.pos[0], cam.pos[1], cam.pos[2]);
  camTarget.set(cam.tgt[0], cam.tgt[1], cam.tgt[2]);
  camera.lookAt(camTarget);
  if (Math.abs(camera.fov - cam.fov) > 0.001) {
    camera.fov = cam.fov;
    camera.updateProjectionMatrix();
  }

  // Part opacities
  const oEngine = partOpacityFor(currentProgress, [0.20, 0.28, 0.44, 0.50]);
  const oBrakes = partOpacityFor(currentProgress, [0.54, 0.60, 0.66, 0.72]);
  const oSusp = partOpacityFor(currentProgress, [0.74, 0.80, 0.86, 0.92]);

  engineKit.materials.forEach(m => {
    m.opacity = oEngine;
    m.depthWrite = oEngine > 0.95;
  });
  brakesKit.materials.forEach(m => {
    m.opacity = oBrakes;
    m.depthWrite = oBrakes > 0.95;
  });
  suspKit.materials.forEach(m => {
    m.opacity = oSusp;
    m.depthWrite = oSusp > 0.95;
  });

  vitrineEngine.intensity = 8 * oEngine;
  vitrineBrakes.intensity = 9 * oBrakes;
  vitrineSuspension.intensity = 8 * oSusp;

  // Engine slow sway
  if (engineKit.group) {
    engineKit.group.rotation.y = Math.sin(now * 0.00015) * 0.18;
  }

  // Chapter for HUD
  let chapter = 0;
  if (currentProgress > 0.20 && currentProgress < 0.52) chapter = 1;
  else if (currentProgress >= 0.52 && currentProgress < 0.72) chapter = 2;
  else if (currentProgress >= 0.72 && currentProgress < 0.90) chapter = 3;
  else if (currentProgress >= 0.90) chapter = 4;
  window.appState.chapter = chapter;

  // Update hotspot projections (for React to read)
  window.appState._hotspotScreenPositions = computeHotspotPositions();

  composer.render();
}

function computeHotspotPositions() {
  const out = { engine: [], brakes: [], suspension: [] };
  const w = window.innerWidth;
  const h = window.innerHeight;
  for (const key of Object.keys(window.appState.hotspots)) {
    for (const hs of window.appState.hotspots[key]) {
      tmpV.set(hs.pos[0], hs.pos[1], hs.pos[2]);
      tmpV.project(camera);
      out[key].push({
        name: hs.name,
        x: (tmpV.x * 0.5 + 0.5) * w,
        y: (-tmpV.y * 0.5 + 0.5) * h,
        z: tmpV.z,
      });
    }
  }
  return out;
}

requestAnimationFrame(animate);

// Signal HUD to render
window.dispatchEvent(new CustomEvent('app:ready'));
</script>

/* ───────── Language hook (sync with app state + custom event) ───────── */
function useLanguage() {
  const [lang, setLangState] = useState(window.appState.language);
  useEffect(() => {
    const onChange = (e) => setLangState(e.detail);
    window.addEventListener('app:lang', onChange);
    return () => window.removeEventListener('app:lang', onChange);
  }, []);
  const setLang = useCallback((l) => window.appState.setLanguage(l), []);
  return [lang, setLang];
}

/* ───────── Animation frame state subscription ───────── */
function useAppFrame() {
  const [, setTick] = useState(0);
  useEffect(() => {
    let raf;
    const tick = () => {
      setTick(t => (t + 1) % 1000000);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return window.appState;
}

/* ───────── Preloader ───────── */
function Preloader({ t }) {
  const [pct, setPct] = useState(0);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const onP = () => setPct(window.appState.loaded);
    const onL = () => { setPct(100); setTimeout(() => setDone(true), 600); };
    window.addEventListener('app:progress', onP);
    window.addEventListener('app:loaded', onL);
    return () => {
      window.removeEventListener('app:progress', onP);
      window.removeEventListener('app:loaded', onL);
    };
  }, []);
  return (
    <div className={`preloader ${done ? 'done' : ''}`} aria-hidden={done}>
      <div className="preloader__inner">
        <div
          className="preloader__wordmark"
          style={{ backgroundPosition: `0% ${100 - pct}%` }}
        >
          {t.brand}
        </div>
        <div className="preloader__bar" style={{ '--p': pct / 100 }} aria-label={`${pct}%`} />
        <div className="preloader__caption">{t.streaming} {String(pct).padStart(3, '0')}/100</div>
      </div>
    </div>
  );
}

  return (
    <footer className="dock">
      <div className="dock__progress" aria-label={`התקדמות ${pct} אחוז`}>
        <span className="label-top">{t.chapters[ch] || ''}</span>
        <span className="number" dir="ltr">{String(pct).padStart(2, '0')}<span style={{ color: 'var(--ink-mute)', fontSize: '0.5em' }}>/100</span></span>
      </div>
      <div className="dock__timeline">
        <div className="dock__timeline-track">
          <div className="dock__timeline-fill" style={{ '--p': p }} />
        </div>
        <div className="dock__timeline-dots">
          {targets.map((tp, i) => (
            <button
              key={i}
              className={`dock__timeline-dot ${ch === i ? 'active' : ''}`}
              style={{ insetInlineStart: `${tp * 100}%` }}
              onClick={() => window.appState.jumpTo(tp)}
              aria-label={`עבור ל${t.chapters[i]}`}
            />
          ))}
        </div>
        <div className="dock__timeline-labels">
          {targets.map((tp, i) => (
            <span key={i} className="dock__timeline-label" style={{ insetInlineStart: `${tp * 100}%` }}>
              {t.chapters[i]}
            </span>
          ))}
        </div>
      </div>
      <div className="dock__scroll">
        <span>{t.scroll}</span>
        <span className="line" aria-hidden="true" />
      </div>
    </footer>
  );
}

/* ───────── Hotspots ───────── */
function smoothstepJS(a, b, x) {
  const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
function windowOpacity(p, [a, b, c, d]) {
  return Math.min(smoothstepJS(a, b, p), 1 - smoothstepJS(c, d, p));
}
function Hotspots({ t }) {
  const state = useAppFrame();
  const ch = state.chapter;
  const positions = state._hotspotScreenPositions || { engine: [], brakes: [], suspension: [] };

  let activeSet = null;
  let activeOpacity = 0;
  const p = state.progress;

  if (ch === 1) {
    activeSet = positions.engine;
    activeOpacity = windowOpacity(p, [0.24, 0.30, 0.44, 0.48]);
  } else if (ch === 2) {
    activeSet = positions.brakes;
    activeOpacity = windowOpacity(p, [0.58, 0.61, 0.66, 0.70]);
  } else if (ch === 3) {
    activeSet = positions.suspension;
    activeOpacity = windowOpacity(p, [0.78, 0.81, 0.86, 0.90]);
  }

  activeOpacity = Math.max(0, Math.min(1, activeOpacity));

  if (!activeSet || activeOpacity < 0.02) return null;

  return (
    <>
      {activeSet.map((hs, i) => {
        if (hs.z > 1 || hs.z < -1) return null; // behind camera
        return (
          <div
            key={hs.name}
            className="hotspot"
            style={{
              transform: `translate3d(${hs.x}px, ${hs.y}px, 0) translate(-50%, -50%)`,
              opacity: activeOpacity,
            }}
          >
            <div className="hotspot__dot">
              <div className="hotspot__dot-inner" />
            </div>
            <div className="hotspot__label">{t[hs.name]}</div>
          </div>
        );
      })}
    </>
  );
}

/* ───────── Tweaks panel ───────── */
function TweaksPanel({ t, lang, setLang }) {
  const [minimized, setMinimized] = useState(true);
  const [accent, setAccent] = useState(window.appState.accent);
  const [body, setBody] = useState(window.appState.body);
  const [bloom, setBloom] = useState(window.appState.bloomTweak);
  const [lerpStrength, setLerpStrength] = useState(window.appState.lerpStrength);
  const [scrollLen, setScrollLen] = useState(window.appState.scrollLength);

  const accentSwatches = ['#c8a567', '#00e5ff', '#ff3b30', '#7af0a0', '#d97757'];
  const bodySwatches = ['#1a1a1a', '#0f1a2a', '#5a0a0a', '#1a1a25', '#262626', '#8a6a1a'];

  const onAccent = (c) => { setAccent(c); window.appState.setAccent(c); };
  const onBody = (c) => { setBody(c); window.appState.setBody(c); };
  const onBloom = (v) => { setBloom(v); window.appState.setBloom(v); };
  const onLerp = (v) => { setLerpStrength(v); window.appState.setLerp(v); };
  const onScrollLen = (v) => { setScrollLen(v); window.appState.setScrollLength(v); };

  const reset = () => {
    onAccent('#c8a567');
    onBody('#0a0a0c');
    onBloom(1.0);
    onLerp(0.08);
    onScrollLen(1.0);
    window.appState.jumpTo(0);
  };

  if (minimized) {
    return (
      <button className="tweaks__fab" onClick={() => setMinimized(false)} aria-label={t.tweaks}>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.4">
          <circle cx="9" cy="9" r="2.4" />
          <path d="M9 1v3M9 14v3M1 9h3M14 9h3M3.6 3.6l2.1 2.1M12.3 12.3l2.1 2.1M3.6 14.4l2.1-2.1M12.3 5.7l2.1-2.1" />
        </svg>
      </button>
    );
  }

  return (
    <div className="tweaks" role="region" aria-label={t.tweaks}>
      <div className="tweaks__handle">
        <span>{t.tweaks}</span>
        <button className="tweaks__close" onClick={() => setMinimized(true)} aria-label="סגור">
          <svg width="14" height="14" viewBox="0 0 14 14"><line x1="3" y1="3" x2="11" y2="11" stroke="currentColor" /><line x1="11" y1="3" x2="3" y2="11" stroke="currentColor" /></svg>
        </button>
      </div>
      <div className="tweaks__body">
        <div className="tweaks__section">
          <h4>{t.tweakVisual}</h4>
          <div className="tweaks__row"><label>{t.tweakAccent}</label></div>
          <div className="tweaks__swatches">
            {accentSwatches.map(c => (
              <button
                key={c}
                className={`tweaks__swatch ${accent === c ? 'active' : ''}`}
                style={{ background: c }}
                onClick={() => onAccent(c)}
                aria-label={c}
              />
            ))}
          </div>
          <div className="tweaks__row" style={{ marginTop: 12 }}><label>{t.tweakBody}</label></div>
          <div className="tweaks__swatches">
            {bodySwatches.map(c => (
              <button
                key={c}
                className={`tweaks__swatch ${body === c ? 'active' : ''}`}
                style={{ background: c }}
                onClick={() => onBody(c)}
                aria-label={c}
              />
            ))}
          </div>
          <div className="tweaks__row" style={{ marginTop: 12 }}>
            <label>{t.tweakBloom}</label>
            <input type="range" min="0" max="2" step="0.05" value={bloom} onChange={e => onBloom(+e.target.value)} />
            <span className="value">{bloom.toFixed(2)}</span>
          </div>
        </div>

        <div className="tweaks__section">
          <h4>{t.tweakMotion}</h4>
          <div className="tweaks__row">
            <label>{t.tweakLerp}</label>
            <input type="range" min="0.02" max="0.30" step="0.01" value={lerpStrength} onChange={e => onLerp(+e.target.value)} />
            <span className="value">{lerpStrength.toFixed(2)}</span>
          </div>
          <div className="tweaks__row">
            <label>{t.tweakScroll}</label>
            <input type="range" min="0.5" max="2.5" step="0.1" value={scrollLen} onChange={e => onScrollLen(+e.target.value)} />
            <span className="value">{scrollLen.toFixed(1)}</span>
          </div>
        </div>

        <div className="tweaks__section">
          <h4>{t.tweakLocale}</h4>
          <div className="tweaks__radios">
            <label>
              <input type="radio" name="lang" checked={lang === 'en'} onChange={() => setLang('en')} />
              English
            </label>
            <label>
              <input type="radio" name="lang" checked={lang === 'he'} onChange={() => setLang('he')} />
              עברית
            </label>
          </div>
        </div>

        <div className="tweaks__section">
          <h4>{t.tweakJump}</h4>
          <div className="tweaks__jumps">
            <button onClick={() => window.appState.jumpTo(0.34)}>{t.tweakJumpEngine}</button>
            <button onClick={() => window.appState.jumpTo(0.62)}>{t.tweakJumpBrakes}</button>
            <button onClick={() => window.appState.jumpTo(0.82)}>{t.tweakJumpSuspension}</button>
            <button onClick={() => window.appState.jumpTo(0.99)}>{t.tweakJumpOutro}</button>
          </div>
          <button
            onClick={reset}
            style={{
              marginTop: 8,
              width: '100%',
              padding: 8,
              border: '1px solid var(--rule)',
              fontSize: 10,
              letterSpacing: '0.16em',
              textTransform: 'uppercase',
              color: 'var(--ink-dim)',
            }}
          >
            {t.tweakReset}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ───────── Root app ───────── */
function App() {
  const [lang, setLang] = useLanguage();
  const t = COPY[lang];
  const [soundOn, setSoundOn] = useState(false);

  // Fade chrome (topbar/dock/siderail/infocard/hotspots) when outro is fully visible
  useEffect(() => {
    let raf;
    const tick = () => {
      const fade = window.appState.progress > 0.94;
      document.body.classList.toggle('chrome-fade', fade);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <>
      <h1 className="sr-only">{t.brand} — אולם תצוגה דיגיטלי לחלפי רכב יוקרתיים</h1>
      <Preloader t={t} />
      <Decorative t={t} />
      <TopBar t={t} lang={lang} setLang={setLang} soundOn={soundOn} toggleSound={() => setSoundOn(s => !s)} />
      <SideRail t={t} />
      <InfoCard t={t} />
      <Hotspots t={t} />
      <BottomDock t={t} />
      <Outro t={t} />
      <TweaksPanel t={t} lang={lang} setLang={setLang} />
      <div id="content" className="sr-only" />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
